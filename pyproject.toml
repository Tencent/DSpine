[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sglang-dspine"
version = "0.2.0"
description = "DSpine speculative decoding for SGLang, as an SGLang plugin"
readme = "README.md"
license = "Apache-2.0"
license-files = ["License.txt", "THIRD_PARTY_NOTICES.txt"]
requires-python = ">=3.11"
# Built and tested against this exact release: the plugin subclasses SGLang internals.
dependencies = ["sglang==0.5.22", "torch==2.14.1", "flashinfer-python==0.7.1", "ninja"]

[project.optional-dependencies]
test = ["pytest", "scipy"]

[project.entry-points."sglang.srt.plugins"]
dspine = "sglang_dspine.plugin:register"

[tool.setuptools.packages.find]
include = ["sglang_dspine*"]

[tool.setuptools.package-data]
"sglang_dspine.verification" = ["calibration.json"]
"sglang_dspine.kernels" = ["csrc/**/*.cpp", "csrc/**/*.cu", "csrc/**/*.cuh"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.isort]
profile = "black"
known_first_party = ["sglang_dspine"]
known_local_folder = ["ref_utils"]
