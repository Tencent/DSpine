name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style:
    name: Formatting and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pre-commit==4.7.0
      - run: pre-commit run --all-files --show-diff-on-failure

  policy:
    name: SPS policy tests (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==9.1.1
      # These tests use only the standard library and pytest. Full plugin and
      # kernel tests need the pinned SGLang/CUDA environment described below.
      - run: python -m pytest tests/test_sps.py -q -k 'not policy_routes and not device_plan'
